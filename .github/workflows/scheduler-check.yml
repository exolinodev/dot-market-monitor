name: Check Cloudflare scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Read status, manually start collection, or run the hourly recovery check"
        type: choice
        options: [status, run, check]
        default: status

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the authenticated scheduler endpoint
        env:
          SCHEDULER_CONTROL_TOKEN: ${{ secrets.SCHEDULER_CONTROL_TOKEN }}
          SCHEDULER_ACTION: ${{ inputs.action }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          action = os.environ['SCHEDULER_ACTION']
          if action not in {'status', 'run', 'check'}:
              raise SystemExit('Invalid action')
          token = os.environ.get('SCHEDULER_CONTROL_TOKEN')
          if not token:
              raise SystemExit('Missing SCHEDULER_CONTROL_TOKEN repository secret')
          url = 'https://dot-market-scheduler.dot-market-monitor.workers.dev/' + action
          request = urllib.request.Request(url, method='GET' if action == 'status' else 'POST',
              headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              # Worker errors contain fixed codes only; never print request headers.
              print('Worker HTTP error:', error.code)
              print(error.read(2048).decode())
              raise SystemExit(1)
          print(json.dumps(result, indent=2))
          if result.get('action') in {'disabled', 'attempt_limit'}:
              raise SystemExit('Scheduler needs attention')
          PY
