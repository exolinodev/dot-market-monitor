name: Tests

on:
  workflow_dispatch:
    inputs:
      live_collection:
        description: Run a real collector in an isolated directory and upload its outputs
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "schema/**"
      - "tests/**"
      - "requirements.txt"
      - "scripts/**"
      - "data/oracle/forecasts/**"
      - "data/oracle/forecast_keys/**"
      - "data/oracle/submissions/**"
      - "data/oracle/inputs/**"
      - "data/oracle/outcomes/**"
      - "data/oracle/outcome_inputs/**"
      - "data/oracle/receipts/**"
      - "CHATGPT_MONITOR_PROMPT.md"
      - ".github/workflows/**"
  pull_request:
    # Trusted producer data PRs carry their own `test` check-run; a GITHUB_TOKEN
    # PR cannot start this workflow and only leaves an empty failed run behind.
    # Oracle drafts stay covered so the archive guard still reviews submissions.
    paths:
      - "**"
      - "!data/**"
      - "data/oracle/submissions/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - run: python -m pip install --disable-pip-version-check --progress-bar off -r tests/requirements.txt
      - name: Guard immutable Oracle audit records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE="${BASE_SHA:-${PUSH_BASE_SHA:-HEAD^}}"
          python scripts/check_oracle_archive.py --base "$BASE"
      - run: python -m pytest -q
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Test Cloudflare scheduler
        run: node --test tests/scheduler.test.mjs

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --progress-bar off -r requirements.txt
      - name: Collect real market data without publishing to main
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/oracle-smoke"
          cp -R data/. "$RUNNER_TEMP/oracle-smoke/"
          python src/main.py --data-dir "$RUNNER_TEMP/oracle-smoke"
      - name: Verify fresh Oracle context
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from output import validate_snapshot
          from oracle_common import digest
          from oracle_consumer import PART_BYTES
          p = Path(os.environ['RUNNER_TEMP']) / 'oracle-smoke/llm_snapshot.json'
          s = json.loads(p.read_text())
          validate_snapshot(s)
          ref = datetime.fromisoformat(s['meta']['generated_at_utc'].replace('Z', '+00:00'))
          assert 0 <= (datetime.now(timezone.utc)-ref).total_seconds() <= 900
          assert s['meta']['fresh'] and s['meta']['status'] in ('ok', 'partial')
          c = s['markets']['DOTUSD']['oracle_context']
          assert c['schema_version'] == 1 and c['current_features']['features']
          index = json.loads((p.parent / 'oracle/consumer/index.json').read_text())
          assert index['snapshot_sha256'] == digest(s)
          for part in index['parts']:
              path = p.parent / 'oracle/consumer' / part['path']
              assert path.stat().st_size == part['bytes'] <= PART_BYTES
              assert digest(json.loads(path.read_text())) == part['sha256']
          print(json.dumps({'generated_at_utc': s['meta']['generated_at_utc'],
              'status': s['meta']['status'], 'oracle_status': c['status'],
              'feature_count': len(c['current_features']['features'])}))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: oracle-live-smoke
          path: ${{ runner.temp }}/oracle-smoke/
          retention-days: 7
