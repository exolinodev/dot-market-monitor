name: Update DOT market data

on:
  workflow_dispatch:
  schedule:
    # Independent fallback if Cloudflare stops delivering events. GitHub can be late.
    - cron: "52 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "schema/**"
      - "scripts/validate_snapshot.py"
      - "scripts/collection_due.py"
      - "requirements.txt"
      - ".github/workflows/market-data.yml"

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: dot-market-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Skip collection when the snapshot is already current
        id: freshness
        run: python3 scripts/collection_due.py

      - name: Set up Python
        if: steps.freshness.outputs.due == 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        if: steps.freshness.outputs.due == 'true'
        run: python -m pip install --disable-pip-version-check --progress-bar off -r tests/requirements.txt

      - name: Collect market data and indicators
        if: steps.freshness.outputs.due == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python src/main.py

      - name: Set up Node for scheduler checks
        if: steps.freshness.outputs.due == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Publish tested snapshot through a protected data PR
        if: steps.freshness.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dot-market-bot"
          git config user.email "dot-market-bot@users.noreply.github.com"
          git add data/latest.json data/latest.md data/llm_snapshot.json data/history.json data/raw/latest.json.gz data/raw/ohlc_cache.json.gz
          git add data/oracle/consumer
          if [ -f data/raw/observation_history.json.gz ]; then
            git add data/raw/observation_history.json.gz
          fi
          if [ -f data/raw/oracle_feature_history.json.gz ]; then
            git add data/raw/oracle_feature_history.json.gz data/raw/oracle_market_outcomes.json.gz data/oracle_scorecard.json data/oracle/pending_outcomes.json
          fi
          if [ -d data/oracle/outcomes ]; then
            git add data/oracle/outcomes data/oracle/outcome_inputs
          fi
          python scripts/promote_data.py collector
