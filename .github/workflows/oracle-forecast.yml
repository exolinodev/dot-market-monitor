name: Publish Oracle forecast
on:
  pull_request_target:
    types: [opened]
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Full main commit SHA containing the exact consumed llm_snapshot.json
        required: true
        type: string
      forecast_json:
        description: Complete schema-valid Oracle forecast JSON (creation within 120 seconds)
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  checks: write
concurrency:
  group: dot-market-data
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'oracle-submission/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --progress-bar off -r tests/requirements.txt
      - name: Validate and publish create-only
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
          FORECAST_JSON: ${{ inputs.forecast_json }}
        run: python scripts/publish_oracle_dispatch.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Publish tested forecast through a protected data PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dot-market-bot"
          git config user.email "dot-market-bot@users.noreply.github.com"
          git add data/oracle/forecasts data/oracle/inputs data/oracle/forecast_keys data/oracle/submissions data/oracle/receipts
          python scripts/promote_data.py oracle
      - name: Close processed draft (the branch is never merged)
        if: success() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
